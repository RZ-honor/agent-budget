[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-budget"
version = "1.0.0"
description = "Context budget, convergence guard and failure governance for a lightweight agent kernel, with paired SWE-bench cost evaluation"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.55",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
